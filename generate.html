<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EA生成 | AI EA Platform</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #f6f7f9;
      color: #111827;
    }

    header {
      background: #ffffff;
      border-bottom: 1px solid #e5e7eb;
      padding: 18px 7%;
    }

    .brand {
      font-size: 18px;
      font-weight: 800;
      letter-spacing: 0.08em;
    }

    main {
      max-width: 1100px;
      margin: 0 auto;
      padding: 60px 24px 100px;
    }

    .eyebrow {
      font-size: 14px;
      font-weight: 800;
      letter-spacing: 0.08em;
      margin-bottom: 20px;
    }

    h1 {
      font-size: 42px;
      line-height: 1.25;
      margin: 0 0 18px;
    }

    .lead {
      font-size: 18px;
      line-height: 1.8;
      color: #4b5563;
      margin-bottom: 36px;
    }

    .card {
      background: #ffffff;
      border: 1px solid #e5e7eb;
      border-radius: 22px;
      padding: 34px;
      margin-bottom: 24px;
    }

    .card h2 {
      margin-top: 0;
      font-size: 25px;
    }

    .status {
      padding: 18px 20px;
      border-radius: 14px;
      background: #f3f4f6;
      line-height: 1.7;
      margin-bottom: 22px;
      font-weight: 600;
    }

    .loading {
      text-align: center;
      padding: 45px 20px;
    }

    .spinner {
      width: 42px;
      height: 42px;
      border: 4px solid #e5e7eb;
      border-top-color: #111827;
      border-radius: 50%;
      margin: 0 auto 20px;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    .section {
      margin-top: 30px;
    }

    .section h3 {
      font-size: 20px;
      margin-bottom: 14px;
    }

    .item {
      background: #f9fafb;
      border: 1px solid #e5e7eb;
      border-radius: 14px;
      padding: 17px 19px;
      margin-bottom: 10px;
      line-height: 1.65;
    }

    .label {
      display: block;
      color: #6b7280;
      font-size: 13px;
      margin-bottom: 5px;
    }

    .value {
      font-weight: 700;
      white-space: pre-wrap;
    }

    ul {
      padding-left: 22px;
      line-height: 1.8;
    }

    .warning {
      background: #fff7ed;
      border: 1px solid #fed7aa;
    }

    .question {
      background: #eff6ff;
      border: 1px solid #bfdbfe;
    }

    .default {
      background: #f0fdf4;
      border: 1px solid #bbf7d0;
    }

    .error {
      background: #fef2f2;
      border: 1px solid #fecaca;
      color: #991b1b;
      padding: 20px;
      border-radius: 14px;
      line-height: 1.7;
    }

    button {
      border: 0;
      border-radius: 12px;
      padding: 15px 24px;
      font-size: 16px;
      font-weight: 800;
      cursor: pointer;
    }

    .primary {
      background: #111827;
      color: white;
    }

    .secondary {
      background: #e5e7eb;
      color: #111827;
      margin-right: 10px;
    }

    .buttons {
      margin-top: 30px;
    }

    pre {
      white-space: pre-wrap;
      word-break: break-word;
      background: #111827;
      color: #f9fafb;
      border-radius: 14px;
      padding: 20px;
      overflow: auto;
      line-height: 1.6;
    }

    @media (max-width: 700px) {
      main {
        padding: 35px 16px 70px;
      }

      h1 {
        font-size: 31px;
      }

      .card {
        padding: 22px;
      }
    }
  </style>
</head>

<body>

<header>
  <div class="brand">AI EA PLATFORM</div>
</header>

<main>

  <div class="eyebrow">AI EA ANALYSIS</div>

  <h1>AIがあなたのEA仕様を分析します。</h1>

  <p class="lead">
    ヒアリング内容をAIが解析し、
    実際にEAへ落とし込めるトレードルールへ整理します。
  </p>

  <div class="card">

    <div id="loading" class="loading">
      <div class="spinner"></div>
      <strong>EA仕様をAIが分析しています...</strong>
      <p>条件・リスク管理・不足情報を確認しています。</p>
    </div>

    <div id="result" style="display:none;"></div>

  </div>

</main>

<script>
  const API_URL = "https://ai-ea-api.crypters358369.workers.dev/";

  const loadingEl = document.getElementById("loading");
  const resultEl = document.getElementById("result");

  function escapeHtml(value) {
    return String(value ?? "")
      .replaceAll("&", "&amp;")
      .replaceAll("<", "&lt;")
      .replaceAll(">", "&gt;")
      .replaceAll('"', "&quot;")
      .replaceAll("'", "&#039;");
  }

  function getStoredData() {
    const possibleKeys = [
      "eaInterview",
      "interviewAnswers",
      "answers",
      "eaAnswers",
      "interviewData"
    ];

    for (const key of possibleKeys) {
      const raw = localStorage.getItem(key);

      if (!raw) continue;

      try {
        const parsed = JSON.parse(raw);

        if (parsed && typeof parsed === "object") {
          return parsed;
        }
      } catch (e) {
        console.warn("Could not parse:", key);
      }
    }

    return null;
  }

  function normalizeInterviewData(stored) {
    if (!stored) return null;

    if (stored.answers && typeof stored.answers === "object") {
      return {
        answers: stored.answers,
        userLevel:
          stored.userLevel ||
          stored.level ||
          stored.answers.userLevel ||
          "unknown"
      };
    }

    return {
      answers: stored,
      userLevel:
        stored.userLevel ||
        stored.level ||
        stored.knowledge ||
        "unknown"
    };
  }

  function renderList(title, values, className = "") {
    if (!Array.isArray(values) || values.length === 0) {
      return "";
    }

    return `
      <div class="section">
        <h3>${escapeHtml(title)}</h3>

        ${values.map(value => {
          if (typeof value === "object") {
            return `
              <div class="item ${className}">
                <pre>${escapeHtml(JSON.stringify(value, null, 2))}</pre>
              </div>
            `;
          }

          return `
            <div class="item ${className}">
              ${escapeHtml(value)}
            </div>
          `;
        }).join("")}
      </div>
    `;
  }

  function renderStrategy(strategy) {
    if (!strategy || typeof strategy !== "object") {
      return "";
    }

    const simpleFields = [
      ["市場", strategy.market],
      ["銘柄", strategy.symbol],
      ["時間足", strategy.timeframe],
      ["トレードスタイル", strategy.style],
      ["損切り", strategy.stopLoss],
      ["利益確定", strategy.takeProfit],
      ["ロット・資金管理", strategy.positionSizing],
      ["取引時間", strategy.tradingHours]
    ];

    let html = `
      <div class="section">
        <h3>EA基本仕様</h3>
    `;

    for (const [label, value] of simpleFields) {
      if (!value) continue;

      html += `
        <div class="item">
          <span class="label">${escapeHtml(label)}</span>
          <div class="value">${escapeHtml(value)}</div>
        </div>
      `;
    }

    html += `</div>`;

    html += renderList(
      "買いエントリー条件",
      strategy.buyConditions
    );

    html += renderList(
      "売りエントリー条件",
      strategy.sellConditions
    );

    html += renderList(
      "決済条件",
      strategy.exitConditions
    );

    html += renderList(
      "フィルター",
      strategy.filters
    );

    html += renderList(
      "リスク管理",
      strategy.riskControls
    );

    return html;
  }

 function renderAnalysis(analysis) {

  const status =
    analysis.status === "ready"
      ? "EA仕様を作成できる状態です"
      : analysis.status === "needs_clarification"
      ? "EA仕様を確定するため、追加確認が必要です"
      : "AI分析結果";

  let html = `
    <h2>AI分析結果</h2>

    <div class="status">
      ${escapeHtml(status)}
    </div>
  `;

  if (analysis.summary) {
    html += `
      <div class="section">
        <h3>手法の概要</h3>
        <div class="item">
          ${escapeHtml(analysis.summary)}
        </div>
      </div>
    `;
  }

  html += renderStrategy(analysis.strategy);

  html += renderList(
    "AIからの追加質問",
    analysis.additionalQuestions,
    "question"
  );

  if (
    Array.isArray(analysis.additionalQuestions) &&
    analysis.additionalQuestions.length > 0
  ) {

    html += `
      <div class="section">

        <h3>追加質問への回答</h3>

        <div id="clarificationAnswers">

          ${analysis.additionalQuestions.map((question, index) => {

            const questionText =
              typeof question === "object"
                ? (
                    question.question ||
                    question.text ||
                    question.item ||
                    JSON.stringify(question)
                  )
                : question;

            return `
              <div class="item">

                <div>
                  <strong>
                    ${index + 1}. ${escapeHtml(questionText)}
                  </strong>
                </div>

                <textarea
                  id="clarification-${index}"
                  rows="3"
                  placeholder="この質問への回答を入力してください"
                  style="
                    width:100%;
                    box-sizing:border-box;
                    margin-top:12px;
                    padding:12px;
                    border:1px solid #d1d5db;
                    border-radius:10px;
                    font-size:16px;
                  "
                ></textarea>

              </div>
            `;

          }).join("")}

        </div>

      </div>
    `;
  }

  html += renderList(
    "確認された矛盾",
    analysis.contradictions,
    "warning"
  );

  html += renderList(
    "AIの推奨設定候補",
    analysis.reasonableDefaults,
    "default"
  );

  html += renderList(
    "リスク上の注意",
    analysis.riskWarnings,
    "warning"
  );

  html += `
    <div class="buttons">

      <button
        class="secondary"
        onclick="location.href='interview.html'"
      >
        ヒアリングに戻る
      </button>

    </div>
  `;

  resultEl.innerHTML = html;
} 
  async function analyzeEA() {

    try {

      const stored = getStoredData();
      const interview = normalizeInterviewData(stored);

      if (!interview) {
        throw new Error(
          "ヒアリングデータが見つかりません。ヒアリング画面からもう一度進んでください。"
        );
      }

      const response = await fetch(API_URL, {
        method: "POST",

        headers: {
          "Content-Type": "application/json"
        },

        body: JSON.stringify({
          answers: interview.answers,
          userLevel: interview.userLevel
        })
      });

      const data = await response.json();

      if (!response.ok) {
        throw new Error(
          data.message ||
          data.error ||
          "AI APIへの接続に失敗しました。"
        );
      }

      if (!data.success) {
        throw new Error(
          data.error ||
          "AI分析に失敗しました。"
        );
      }

      localStorage.setItem(
        "eaAnalysis",
        JSON.stringify(data.analysis)
      );

      loadingEl.style.display = "none";
      resultEl.style.display = "block";

      renderAnalysis(data.analysis);

    } catch (error) {

      console.error(error);

      loadingEl.style.display = "none";
      resultEl.style.display = "block";

      resultEl.innerHTML = `
        <h2>分析できませんでした</h2>

        <div class="error">
          ${escapeHtml(error.message)}
        </div>

        <div class="buttons">
          <button
            class="secondary"
            onclick="location.href='interview.html'"
          >
            ヒアリングに戻る
          </button>

          <button
            class="primary"
            onclick="location.reload()"
          >
            もう一度試す
          </button>
        </div>
      `;
    }
  }

  analyzeEA();
</script>

</body>
</html>
