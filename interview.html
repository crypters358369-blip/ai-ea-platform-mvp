<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EA設計 | AI EA Platform</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  background:#f6f7f9;
  color:#111827;
}

header{
  background:#fff;
  border-bottom:1px solid #e5e7eb;
  padding:18px 7%;
  font-size:20px;
  font-weight:700;
}

.container{
  max-width:820px;
  margin:auto;
  padding:45px 20px 80px;
}

.status{
  display:flex;
  justify-content:space-between;
  gap:15px;
  font-size:14px;
  color:#6b7280;
  margin-bottom:10px;
}

.progress{
  height:8px;
  background:#e5e7eb;
  border-radius:20px;
  overflow:hidden;
  margin-bottom:30px;
}

.progress-bar{
  height:100%;
  width:0%;
  background:#111827;
  transition:.25s;
}

.card{
  background:#fff;
  border:1px solid #e5e7eb;
  border-radius:18px;
  padding:32px;
}

.label{
  font-size:12px;
  font-weight:800;
  letter-spacing:.08em;
  margin-bottom:14px;
}

.level{
  display:inline-block;
  background:#eef2f7;
  padding:7px 12px;
  border-radius:999px;
  font-size:12px;
  font-weight:700;
  margin-bottom:18px;
}

h1{
  margin:0 0 12px;
  font-size:27px;
  line-height:1.45;
}

.description{
  color:#6b7280;
  line-height:1.75;
  margin:0 0 25px;
}

.help{
  background:#f3f4f6;
  border-radius:11px;
  padding:15px;
  line-height:1.7;
  margin-bottom:20px;
  font-size:14px;
}

.choices{
  display:grid;
  gap:11px;
}

.choice{
  width:100%;
  background:#fff;
  border:1px solid #d1d5db;
  border-radius:11px;
  padding:16px;
  text-align:left;
  font-size:16px;
  cursor:pointer;
}

.choice:hover{
  border-color:#111827;
  background:#f9fafb;
}

textarea{
  width:100%;
  min-height:130px;
  border:1px solid #d1d5db;
  border-radius:11px;
  padding:15px;
  font:inherit;
  resize:vertical;
}

.primary,
.secondary{
  border:0;
  border-radius:10px;
  padding:15px 22px;
  font-size:15px;
  font-weight:700;
  cursor:pointer;
}

.primary{
  background:#111827;
  color:#fff;
}

.secondary{
  background:#e5e7eb;
  color:#111827;
}

.full{
  width:100%;
  margin-top:20px;
  font-size:17px;
  padding:17px;
}

.actions{
  display:flex;
  gap:10px;
  flex-wrap:wrap;
  margin-top:18px;
}

.summary{
  display:grid;
  gap:12px;
  margin-top:25px;
}

.summary-item{
  border:1px solid #e5e7eb;
  background:#f9fafb;
  border-radius:11px;
  padding:15px;
}

.summary-q{
  color:#6b7280;
  font-size:12px;
  margin-bottom:5px;
}

.summary-a{
  font-weight:650;
  line-height:1.6;
}

@media(max-width:600px){
  .container{padding:28px 15px 60px}
  .card{padding:22px}
  h1{font-size:22px}
}
</style>
</head>

<body>

<header>AI EA Platform</header>

<main class="container">

<div class="status">
  <span id="progressText">準備中</span>
  <span id="questionText"></span>
</div>

<div class="progress">
  <div class="progress-bar" id="progressBar"></div>
</div>

<section class="card" id="card"></section>

</main>

<script>

/* =========================
   質問データ
========================= */

const questions = [

{
 id:"knowledge",
 title:"まず、あなたのFXの知識レベルを教えてください。",
 beginner:"分からない言葉があっても大丈夫です。あなたに合わせて説明します。",
 type:"choice",
 options:[
   "ほとんど知識がない",
   "基本用語は少し分かる",
   "実際にFX取引をしている",
   "自分のトレード手法がある",
   "EA・自動売買の知識もある"
 ]
},

{
 id:"experience",
 title:"FXの実際の取引経験はどのくらいですか？",
 beginner:"デモ取引だけでも大丈夫です。",
 type:"choice",
 options:[
   "まだ取引したことがない",
   "1年未満",
   "1〜3年",
   "3年以上",
   "専業・かなり経験がある"
 ]
},

{
 id:"strategyState",
 title:"今、EAにしたいトレード手法はありますか？",
 beginner:"「こういう時に買う」程度のアイデアでも大丈夫です。",
 type:"choice",
 options:[
   "まだ手法はない",
   "アイデアだけある",
   "大まかなルールがある",
   "実際に裁量トレードで使っている",
   "かなり細かくルール化している"
 ]
},

{
 id:"market",
 title:"どの市場でEAを使いたいですか？",
 beginner:"最初はFXの通貨ペアから作ることもできます。",
 type:"choice",
 options:[
   "FX",
   "ゴールド",
   "株価指数",
   "暗号資産",
   "まだ分からない"
 ]
},

{
 id:"symbol",
 title:"取引したい銘柄・通貨ペアを教えてください。",
 beginner:"例：ドル円なら USDJPY、ゴールドなら XAUUSD。分からなければ「未定」でOKです。",
 type:"text"
},

{
 id:"style",
 title:"どんなトレードをしたいですか？",
 beginner:"短時間で何度も取引するか、数時間〜数日持つか、という違いです。",
 type:"choice",
 options:[
   "スキャルピング",
   "デイトレード",
   "スイングトレード",
   "長期",
   "まだ分からない"
 ]
},

{
 id:"timeframe",
 title:"主に使う時間足は？",
 beginner:"時間足とは、1本のローソク足が何分・何時間を表すかという設定です。",
 type:"choice",
 options:[
   "1分足",
   "5分足",
   "15分足",
   "30分足",
   "1時間足",
   "4時間足",
   "日足",
   "複数時間足",
   "分からない"
 ]
},

{
 id:"entryType",
 title:"どんな情報を見てエントリーしたいですか？",
 beginner:"エントリーとは、新しく買い・売りの取引を始めることです。",
 type:"choice",
 options:[
   "移動平均線",
   "RSI",
   "MACD",
   "ボリンジャーバンド",
   "ローソク足",
   "水平線・サポートレジスタンス",
   "ブレイクアウト",
   "複数条件を組み合わせる",
   "自分の裁量判断を再現したい",
   "分からない"
 ]
},

{
 id:"indicator",
 title:"インジケーターの設定値があれば教えてください。",
 beginner:"分からなければ「AIに提案してほしい」と入力してください。",
 type:"text",
 showIf:a=>[
 "移動平均線","RSI","MACD",
 "ボリンジャーバンド",
 "複数条件を組み合わせる"
 ].includes(a.entryType)
},

{
 id:"buy",
 title:"どんな時に「買い」たいですか？",
 beginner:"普段チャートを見て『ここなら上がりそう』と思う条件を、分かる範囲で書いてください。",
 type:"text"
},

{
 id:"sell",
 title:"どんな時に「売り」たいですか？",
 beginner:"買い条件の反対なら「買い条件の逆」と入力しても大丈夫です。",
 type:"text"
},

{
 id:"confirmation",
 title:"エントリー前に追加確認を入れますか？",
 beginner:"条件を増やすことで、無駄なエントリーを減らせる場合があります。",
 type:"choice",
 options:[
   "必要ない",
   "上位足の方向を確認",
   "ローソク足確定を待つ",
   "複数条件が一致した時だけ",
   "値動きの大きさを確認",
   "AIに提案してほしい"
 ]
},

{
 id:"stopType",
 title:"損切りはどうしますか？",
 beginner:"損切りとは、損失が大きくなる前に自動で取引を終了する設定です。",
 type:"choice",
 options:[
   "固定pips",
   "直近高値・安値",
   "ATRなど値動きに合わせる",
   "資金に対する損失率",
   "AIに提案してほしい"
 ]
},

{
 id:"stopValue",
 title:"損切りの具体的な条件を教えてください。",
 beginner:"例：20pips、資金の1%。分からなければ「AIに提案してほしい」でOKです。",
 type:"text"
},

{
 id:"profitType",
 title:"利益確定はどうしますか？",
 beginner:"利益が出た時、どこで取引を終了するかを決めます。",
 type:"choice",
 options:[
   "固定pips",
   "リスクリワード比",
   "直近高値・安値",
   "サポート・レジスタンス",
   "トレーリングストップ",
   "反対シグナル",
   "AIに提案してほしい"
 ]
},

{
 id:"profitValue",
 title:"利益確定の具体的な条件を教えてください。",
 beginner:"例：40pips、損切りの2倍。未定ならAIに任せられます。",
 type:"text"
},

{
 id:"risk",
 title:"1回の取引で、口座資金の何％までリスクを取りますか？",
 beginner:"例えば1%なら、10万円の口座で最大約1,000円の損失を目安にします。",
 type:"choice",
 options:[
   "0.5%以下",
   "1%",
   "2%",
   "3%",
   "固定ロット",
   "AIに提案してほしい"
 ]
},

{
 id:"lot",
 title:"ロットサイズはどう決めますか？",
 beginner:"ロットとは取引量のことです。",
 type:"choice",
 options:[
   "固定ロット",
   "口座残高に応じて変更",
   "損切り幅とリスク率から自動計算",
   "AIに提案してほしい"
 ]
},

{
 id:"positions",
 title:"同時に持てる最大ポジション数は？",
 beginner:"同時に何件まで取引を持てるようにするかです。",
 type:"choice",
 options:[
   "1",
   "2",
   "3",
   "5",
   "制限なし",
   "AIに提案してほしい"
 ]
},

{
 id:"hours",
 title:"取引する時間帯を制限しますか？",
 beginner:"特定の市場時間だけEAを動かすことができます。",
 type:"choice",
 options:[
   "24時間",
   "東京時間",
   "ロンドン時間",
   "ニューヨーク時間",
   "ロンドン＋ニューヨーク",
   "時間を指定したい",
   "AIに提案してほしい"
 ]
},

{
 id:"hoursDetail",
 title:"希望する取引時間を入力してください。",
 beginner:"例：日本時間16:00〜24:00。",
 type:"text",
 showIf:a=>a.hours==="時間を指定したい"
},

{
 id:"days",
 title:"取引する曜日を制限しますか？",
 beginner:"金曜日の夜などを避ける設定もできます。",
 type:"choice",
 options:[
   "月〜金",
   "月曜を除く",
   "金曜を除く",
   "月曜と金曜を除く",
   "AIに提案してほしい"
 ]
},

{
 id:"spread",
 title:"スプレッドが広い時は取引を止めますか？",
 beginner:"スプレッドは取引時の実質的なコストです。広すぎる時の取引を防げます。",
 type:"choice",
 options:[
   "止める",
   "止めない",
   "AIに適切な設定を任せる"
 ]
},

{
 id:"news",
 title:"重要な経済指標の前後は取引を止めますか？",
 beginner:"雇用統計やCPIなどでは相場が急変することがあります。",
 type:"choice",
 options:[
   "止める",
   "重要度が高い時だけ止める",
   "止めない",
   "AIに提案してほしい"
 ]
},

{
 id:"trailing",
 title:"利益が伸びた時、ストップを自動で追従させますか？",
 beginner:"これはトレーリングストップと呼ばれる機能です。",
 type:"choice",
 options:[
   "使う",
   "使わない",
   "条件次第",
   "AIに提案してほしい"
 ]
},

{
 id:"breakeven",
 title:"利益が出たら損切り位置を建値へ移動しますか？",
 beginner:"建値へ移動すると、利益が出た後に損失へ転じるリスクを抑えられます。",
 type:"choice",
 options:[
   "使う",
   "使わない",
   "AIに提案してほしい"
 ]
},

{
 id:"martingale",
 title:"ナンピンやマーチンゲールを使いますか？",
 beginner:"どちらもリスクが大きくなりやすい手法です。分からなければ使わない設定を推奨します。",
 type:"choice",
 options:[
   "どちらも使わない",
   "ナンピンのみ",
   "マーチンゲール",
   "両方",
   "分からない"
 ]
},

{
 id:"dailyLoss",
 title:"1日の損失が一定額を超えたらEAを停止しますか？",
 beginner:"大きな連敗から口座を守るための安全機能です。",
 type:"choice",
 options:[
   "1%",
   "2%",
   "3%",
   "5%",
   "停止しない",
   "AIに提案してほしい"
 ]
},

{
 id:"maxTrades",
 title:"1日の最大取引回数を設定しますか？",
 beginner:"取引しすぎを防ぐための設定です。",
 type:"choice",
 options:[
   "1回",
   "3回",
   "5回",
   "10回",
   "制限なし",
   "AIに提案してほしい"
 ]
},

{
 id:"priority",
 title:"このEAで一番重視したいものは？",
 beginner:"利益だけでなく、安定性や損失の小ささを優先することもできます。",
 type:"choice",
 options:[
   "安定性",
   "利益率",
   "低ドローダウン",
   "勝率",
   "リスクリワード",
   "取引回数",
   "自分の手法の忠実な再現"
 ]
},

{
 id:"extra",
 title:"最後に、EAへ絶対に入れたい条件があれば教えてください。",
 beginner:"特になければ「なし」で大丈夫です。",
 type:"text"
}

];

/* =========================
   状態
========================= */

let answers = {};
let history = [];
let currentIndex = 0;
let userLevel = "unknown";

const card=document.getElementById("card");
const progressText=document.getElementById("progressText");
const questionText=document.getElementById("questionText");
const progressBar=document.getElementById("progressBar");

/* =========================
   レベル判定
========================= */

function determineLevel(){

 const k=answers.knowledge;

 if(
   k==="ほとんど知識がない" ||
   k==="基本用語は少し分かる"
 ){
   userLevel="beginner";
 }

 else if(
   k==="実際にFX取引をしている"
 ){
   userLevel="intermediate";
 }

 else if(k){
   userLevel="advanced";
 }

}

function levelLabel(){

 if(userLevel==="beginner"){
   return "FX知識レベル：初級";
 }

 if(userLevel==="intermediate"){
   return "FX知識レベル：中級";
 }

 if(userLevel==="advanced"){
   return "FX知識レベル：上級";
 }

 return "FX知識レベル判定中";

}

/* =========================
   表示質問
========================= */

function visibleQuestions(){

 return questions.filter(q=>{

   if(!q.showIf) return true;

   try{
     return q.showIf(answers);
   }catch{
     return false;
   }

 });

}

/* =========================
   質問表示
========================= */

function render(){

 determineLevel();

 const visible=visibleQuestions();

 if(currentIndex>=visible.length){
   finish();
   return;
 }

 const q=visible[currentIndex];

 const percent=Math.round(
   currentIndex/visible.length*100
 );

 progressText.textContent=
   `EA設計進捗：${percent}%`;

 questionText.textContent=
   `質問 ${currentIndex+1} / ${visible.length}`;

 progressBar.style.width=
   `${percent}%`;

 card.innerHTML="";

 const label=document.createElement("div");
 label.className="label";
 label.textContent="AI EA ASSISTANT";

 card.appendChild(label);

 if(answers.knowledge){

   const level=document.createElement("div");

   level.className="level";
   level.textContent=levelLabel();

   card.appendChild(level);

 }

 const title=document.createElement("h1");
 title.textContent=q.title;

 card.appendChild(title);

 if(
   userLevel==="beginner" &&
   q.beginner
 ){

   const help=document.createElement("div");

   help.className="help";
   help.innerHTML=
     `<strong>かんたん説明</strong><br>${q.beginner}`;

   card.appendChild(help);

 }

 const description=document.createElement("p");
 description.className="description";

 if(userLevel==="advanced"){
   description.textContent=
     "具体的な条件・数値が決まっている場合は、できるだけ明確に指定してください。";
 }else{
   description.textContent=
     "最も近い内容を選んでください。";
 }

 card.appendChild(description);

 if(q.type==="choice"){

   const choices=document.createElement("div");
   choices.className="choices";

   q.options.forEach(option=>{

     const button=document.createElement("button");

     button.className="choice";
     button.textContent=option;

     button.onclick=()=>{
       save(q,option);
     };

     choices.appendChild(button);

   });

   card.appendChild(choices);

 }else{

   const textarea=document.createElement("textarea");

   textarea.placeholder=
     userLevel==="beginner"
     ? "分かる範囲で入力してください"
     : "具体的に入力してください";

   if(answers[q.id]){
     textarea.value=answers[q.id];
   }

   card.appendChild(textarea);

   const actions=document.createElement("div");
   actions.className="actions";

   const next=document.createElement("button");

   next.className="primary";
   next.textContent="次へ";

   next.onclick=()=>{

     const value=textarea.value.trim();

     if(!value){
       alert("回答を入力してください。");
       return;
     }

     save(q,value);

   };

   actions.appendChild(next);
   card.appendChild(actions);

 }

 if(history.length){

   const actions=document.createElement("div");
   actions.className="actions";

   const back=document.createElement("button");

   back.className="secondary";
   back.textContent="← 前の質問へ戻る";
   back.onclick=goBack;

   actions.appendChild(back);
   card.appendChild(actions);

 }

}

/* =========================
   回答保存
========================= */

function save(q,value){

 answers[q.id]=value;

 history.push({
   id:q.id,
   index:currentIndex
 });

 localStorage.setItem(
   "eaInterviewAnswers",
   JSON.stringify(answers)
 );

 currentIndex++;

 render();

}

function goBack(){

 if(!history.length) return;

 const previous=history.pop();

 delete answers[previous.id];

 currentIndex=previous.index;

 localStorage.setItem(
   "eaInterviewAnswers",
   JSON.stringify(answers)
 );

 render();

}

/* =========================
   完了
========================= */

function finish(){

 determineLevel();

 progressText.textContent=
   "EA設計進捗：100%";

 questionText.textContent=
   "ヒアリング完了";

 progressBar.style.width="100%";

 localStorage.setItem(
   "eaInterviewAnswers",
   JSON.stringify(answers)
 );

 localStorage.setItem(
   "eaUserLevel",
   userLevel
 );

 let html="";

 const visible=visibleQuestions();

 visible.forEach(q=>{

   if(!answers[q.id]) return;

   html+=`
   <div class="summary-item">

     <div class="summary-q">
       ${escapeHTML(q.title)}
     </div>

     <div class="summary-a">
       ${escapeHTML(answers[q.id])}
     </div>

   </div>
   `;

 });

 card.innerHTML=`

 <div class="label">
   AI EA ASSISTANT
 </div>

 <div class="level">
   ${levelLabel()}
 </div>

 <h1>
   EA設計ヒアリングが完了しました。
 </h1>

 <p class="description">
   あなたのFX知識レベルと回答内容を保存しました。
   次はAIが内容を整理し、
   EAとして実装可能な仕様へ変換します。
 </p>

 <div class="summary">
   ${html}
 </div>

 <button
   class="primary full"
   onclick="goGenerate()">
   AIでEA仕様を作成する
 </button>

 <button
   class="secondary full"
   onclick="restart()">
   最初からやり直す
 </button>

 `;

}

/* =========================
   次工程
========================= */

function goGenerate(){

 localStorage.setItem(
   "eaInterviewAnswers",
   JSON.stringify(answers)
 );

 localStorage.setItem(
   "eaUserLevel",
   userLevel
 );

 window.location.href=
   "generate.html";

}

function restart(){

 if(!confirm(
   "回答を削除して最初からやり直しますか？"
 )) return;

 answers={};
 history=[];
 currentIndex=0;
 userLevel="unknown";

 localStorage.removeItem(
   "eaInterviewAnswers"
 );

 localStorage.removeItem(
   "eaUserLevel"
 );

 localStorage.removeItem(
   "eaSpecification"
 );

 render();

}

/* =========================
   安全表示
========================= */

function escapeHTML(value){

 return String(value)
 .replaceAll("&","&amp;")
 .replaceAll("<","&lt;")
 .replaceAll(">","&gt;")
 .replaceAll('"',"&quot;")
 .replaceAll("'","&#039;");

}

/* =========================
   開始
========================= */

render();

</script>

</body>
</html>
