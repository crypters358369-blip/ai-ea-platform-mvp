<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>EA設計インタビュー | AI EA Platform</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  background: #f6f7f9;
  color: #111827;
}

header {
  background: #ffffff;
  border-bottom: 1px solid #e5e7eb;
  padding: 18px 7%;
  font-size: 20px;
  font-weight: 700;
}

.container {
  max-width: 820px;
  margin: 0 auto;
  padding: 45px 20px 80px;
}

.status {
  display: flex;
  justify-content: space-between;
  gap: 20px;
  margin-bottom: 10px;
  font-size: 14px;
  color: #6b7280;
}

.progress {
  height: 8px;
  background: #e5e7eb;
  border-radius: 20px;
  overflow: hidden;
  margin-bottom: 30px;
}

.progress-bar {
  height: 100%;
  width: 0;
  background: #111827;
  transition: width .25s ease;
}

.card {
  background: #ffffff;
  border: 1px solid #e5e7eb;
  border-radius: 18px;
  padding: 32px;
}

.label {
  font-size: 12px;
  font-weight: 800;
  letter-spacing: .08em;
  margin-bottom: 14px;
}

h1 {
  margin: 0 0 12px;
  font-size: 27px;
  line-height: 1.45;
}

.description {
  margin: 0 0 26px;
  color: #6b7280;
  line-height: 1.7;
}

.choices {
  display: grid;
  gap: 11px;
}

.choice {
  width: 100%;
  border: 1px solid #d1d5db;
  background: #ffffff;
  border-radius: 11px;
  padding: 16px;
  text-align: left;
  font-size: 16px;
  cursor: pointer;
  transition: .15s ease;
}

.choice:hover {
  border-color: #111827;
  background: #f9fafb;
  transform: translateY(-1px);
}

.text-input {
  width: 100%;
  min-height: 130px;
  border: 1px solid #d1d5db;
  border-radius: 11px;
  padding: 15px;
  font: inherit;
  resize: vertical;
  outline: none;
}

.text-input:focus {
  border-color: #111827;
}

.next-button,
.restart-button {
  margin-top: 15px;
  border: 0;
  border-radius: 10px;
  background: #111827;
  color: #ffffff;
  padding: 14px 22px;
  font-size: 15px;
  font-weight: 700;
  cursor: pointer;
}

.back-button {
  margin-top: 20px;
  border: 0;
  background: transparent;
  color: #6b7280;
  cursor: pointer;
  padding: 5px 0;
}

.summary {
  display: grid;
  gap: 14px;
  margin-top: 25px;
}

.summary-item {
  padding: 16px;
  border: 1px solid #e5e7eb;
  border-radius: 11px;
  background: #f9fafb;
}

.summary-question {
  font-size: 13px;
  color: #6b7280;
  margin-bottom: 6px;
}

.summary-answer {
  font-weight: 650;
  line-height: 1.55;
}

.notice {
  margin-top: 25px;
  padding: 18px;
  border-radius: 12px;
  background: #f3f4f6;
  line-height: 1.7;
}

@media (max-width: 600px) {
  .container {
    padding: 28px 15px 60px;
  }

  .card {
    padding: 22px;
  }

  h1 {
    font-size: 22px;
  }

  .status {
    font-size: 12px;
  }
}
</style>
</head>

<body>

<header>AI EA Platform</header>

<main class="container">

  <div class="status">
    <span id="progressText">EA設計進捗：0%</span>
    <span id="questionText">設計開始</span>
  </div>

  <div class="progress">
    <div class="progress-bar" id="progressBar"></div>
  </div>

  <section class="card" id="card"></section>

</main>

<script>

const questions = [

  {
    id: "experience",
    title: "まず、あなたのトレード経験を教えてください。",
    description: "あなたの経験に合わせてEA設計の質問を調整します。",
    type: "choice",
    options: [
      "FXを始めたばかり",
      "1年未満",
      "1〜3年",
      "3年以上",
      "専業・かなり経験がある"
    ]
  },

  {
    id: "market",
    title: "EAを動かしたい市場は？",
    description: "まず最初に作りたい対象を選んでください。",
    type: "choice",
    options: [
      "FX",
      "ゴールド",
      "株価指数",
      "暗号資産",
      "まだ決めていない"
    ]
  },

  {
    id: "symbol",
    title: "主に取引したい銘柄・通貨ペアは？",
    description: "例：USDJPY、EURUSD、XAUUSD。まだ未定なら「未定」と入力してください。",
    type: "text"
  },

  {
    id: "style",
    title: "どのトレードスタイルに近いですか？",
    description: "最も近いものを選んでください。",
    type: "choice",
    options: [
      "スキャルピング",
      "デイトレード",
      "スイングトレード",
      "長期トレード",
      "複数を組み合わせる"
    ]
  },

  {
    id: "timeframe",
    title: "メインで使いたい時間足は？",
    description: "EAのエントリー判断に使う中心の時間足です。",
    type: "choice",
    options: [
      "1分足",
      "5分足",
      "15分足",
      "30分足",
      "1時間足",
      "4時間足",
      "日足",
      "複数時間足"
    ]
  },

  {
    id: "entryMethod",
    title: "エントリー判断で最も重視するものは？",
    description: "ここから回答に応じて詳細質問を変えます。",
    type: "choice",
    options: [
      "移動平均線",
      "RSI",
      "MACD",
      "ボリンジャーバンド",
      "ローソク足・プライスアクション",
      "水平線・サポートレジスタンス",
      "ブレイクアウト",
      "複数条件の組み合わせ",
      "その他"
    ]
  },

  {
    id: "indicatorSettings",
    title: "使いたいインジケーターの設定値を教えてください。",
    description: "例：EMA20とEMA50、RSI14、MACD 12/26/9。分からなければ「AIに提案してほしい」と入力してください。",
    type: "text",
    showIf: answers => [
      "移動平均線",
      "RSI",
      "MACD",
      "ボリンジャーバンド",
      "複数条件の組み合わせ"
    ].includes(answers.entryMethod)
  },

  {
    id: "entryBuy",
    title: "買いエントリーの条件をできるだけ具体的に教えてください。",
    description: "例：EMA20がEMA50を上抜け、RSIが50以上なら買い。曖昧でも大丈夫です。",
    type: "text"
  },

  {
    id: "entrySell",
    title: "売りエントリーの条件を教えてください。",
    description: "買い条件の逆でよければ、そのように入力しても大丈夫です。",
    type: "text"
  },

  {
    id: "confirmation",
    title: "エントリー前に追加の確認条件は必要ですか？",
    description: "ダマシを減らすためのフィルターです。",
    type: "choice",
    options: [
      "必要ない",
      "上位足の方向を確認",
      "ローソク足確定を待つ",
      "複数インジケーター一致",
      "ボラティリティを確認",
      "その他"
    ]
  },

  {
    id: "stopLoss",
    title: "損切りはどのように決めたいですか？",
    description: "EAのリスク管理で重要な項目です。",
    type: "choice",
    options: [
      "固定pips",
      "直近高値・安値",
      "ATRなどボラティリティ基準",
      "資金に対する損失率",
      "まだ決めていない"
    ]
  },

  {
    id: "stopLossValue",
    title: "損切りの具体的な数値・条件を教えてください。",
    description: "例：20pips、直近安値の5pips下、口座資金の1%。未定でも構いません。",
    type: "text"
  },

  {
    id: "takeProfit",
    title: "利益確定はどのように決めたいですか？",
    description: "最も近い方法を選んでください。",
    type: "choice",
    options: [
      "固定pips",
      "リスクリワード比",
      "直近高値・安値",
      "サポート・レジスタンス",
      "トレーリングストップ",
      "反対シグナルで決済",
      "まだ決めていない"
    ]
  },

  {
    id: "takeProfitValue",
    title: "利益確定の具体的な数値・条件を教えてください。",
    description: "例：40pips、RR 1:2、反対クロスで決済など。",
    type: "text"
  },

  {
    id: "risk",
    title: "1回のトレードで許容するリスクは？",
    description: "口座資金に対する割合で選んでください。",
    type: "choice",
    options: [
      "0.5%以下",
      "1%",
      "2%",
      "3%",
      "固定ロットを使う",
      "まだ決めていない"
    ]
  },

  {
    id: "lot",
    title: "ロットサイズはどのように決めたいですか？",
    description: "資金管理方法を選んでください。",
    type: "choice",
    options: [
      "固定ロット",
      "口座残高に応じて自動計算",
      "損切り幅からリスク率で自動計算",
      "まだ決めていない"
    ]
  },

  {
    id: "maxPositions",
    title: "同時に保有できる最大ポジション数は？",
    description: "リスク集中を防ぐための設定です。",
    type: "choice",
    options: [
      "1ポジション",
      "2ポジション",
      "3ポジション",
      "5ポジションまで",
      "制限しない",
      "まだ決めていない"
    ]
  },

  {
    id: "tradeHours",
    title: "取引する時間帯を制限しますか？",
    description: "サーバー時間ではなく、希望する取引時間のイメージで構いません。",
    type: "choice",
    options: [
      "24時間",
      "東京時間中心",
      "ロンドン時間中心",
      "ニューヨーク時間中心",
      "ロンドン＋ニューヨーク",
      "時間を細かく指定したい"
    ]
  },

  {
    id: "tradeHoursDetail",
    title: "取引時間の詳細を入力してください。",
    description: "例：日本時間16:00〜24:00。細かい指定がなければ「なし」で構いません。",
    type: "text",
    showIf: answers => answers.tradeHours === "時間を細かく指定したい"
  },

  {
    id: "days",
    title: "取引する曜日に制限はありますか？",
    description: "週末前などを除外できます。",
    type: "choice",
    options: [
      "月〜金すべて",
      "月曜日を除外",
      "金曜日を除外",
      "月曜と金曜を除外",
      "細かく指定したい"
    ]
  },

  {
    id: "spread",
    title: "スプレッドが広いときはエントリーを止めますか？",
    description: "実運用では重要な安全フィルターです。",
    type: "choice",
    options: [
      "はい",
      "いいえ",
      "AIに適切な上限を提案してほしい"
    ]
  },

  {
    id: "news",
    title: "重要経済指標の前後は取引を止めたいですか？",
    description: "雇用統計、CPI、FOMCなどの急変対策です。",
    type: "choice",
    options: [
      "止めたい",
      "止めなくていい",
      "重要度が高い指標だけ止めたい",
      "まだ決めていない"
    ]
  },

  {
    id: "trailing",
    title: "トレーリングストップを使いますか？",
    description: "利益が伸びたときに損切り位置を追従させる機能です。",
    type: "choice",
    options: [
      "使う",
      "使わない",
      "条件次第で使う",
      "AIに提案してほしい"
    ]
  },

  {
    id: "breakeven",
    title: "一定利益で建値へストップを移動しますか？",
    description: "利益が出た後の損失を抑える機能です。",
    type: "choice",
    options: [
      "使う",
      "使わない",
      "AIに提案してほしい"
    ]
  },

  {
    id: "martingale",
    title: "ナンピン・マーチンゲールを使いますか？",
    description: "リスクが大きく変わるため明確に設定します。",
    type: "choice",
    options: [
      "どちらも使わない",
      "ナンピンのみ使う",
      "マーチンゲールを使う",
      "両方使う",
      "分からない"
    ]
  },

  {
    id: "maxLoss",
    title: "1日の最大損失でEAを停止させますか？",
    description: "大きな連敗から口座を守る安全機能です。",
    type: "choice",
    options: [
      "1%で停止",
      "2%で停止",
      "3%で停止",
      "5%で停止",
      "停止させない",
      "AIに提案してほしい"
    ]
  },

  {
    id: "maxTrades",
    title: "1日の最大取引回数を設定しますか？",
    description: "過剰取引を防止できます。",
    type: "choice",
    options: [
      "1回",
      "3回",
      "5回",
      "10回",
      "制限しない",
      "AIに提案してほしい"
    ]
  },

  {
    id: "priority",
    title: "このEAで最も優先したいものは？",
    description: "EAの最適化方針を決める重要な質問です。",
    type: "choice",
    options: [
      "安定性",
      "利益率",
      "低ドローダウン",
      "勝率",
      "リスクリワード",
      "取引回数",
      "自分の裁量手法の忠実な再現"
    ]
  },

  {
    id: "strategyState",
    title: "現在の手法はどの段階ですか？",
    description: "EA化に必要な次の工程を判断します。",
    type: "choice",
    options: [
      "まだアイデアだけ",
      "大まかなルールがある",
      "実際に裁量トレードで使っている",
      "かなり細かくルール化済み",
      "すでにバックテスト経験がある"
    ]
  },

  {
    id: "freeText",
    title: "最後に、EAへ絶対に入れたい条件を自由に教えてください。",
    description: "文章で自由に入力してください。特になければ「なし」で構いません。",
    type: "text"
  }

];

let answers = {};
let history = [];
let currentIndex = 0;

const card = document.getElementById("card");
const progressText = document.getElementById("progressText");
const questionText = document.getElementById("questionText");
const progressBar = document.getElementById("progressBar");

function getVisibleQuestions() {
  return questions.filter(q => {
    if (!q.showIf) return true;

    try {
      return q.showIf(answers);
    } catch {
      return false;
    }
  });
}

function render() {

  const visible = getVisibleQuestions();

  if (currentIndex >= visible.length) {
    finishInterview();
    return;
  }

  const q = visible[currentIndex];

  const percent = Math.round(
    (currentIndex / visible.length) * 100
  );

  progressText.textContent =
    `EA設計進捗：${percent}%`;

  questionText.textContent =
    `質問 ${currentIndex + 1} / ${visible.length}`;

  progressBar.style.width =
    `${percent}%`;

  card.innerHTML = "";

  const label = document.createElement("div");
  label.className = "label";
  label.textContent = "AI EA ASSISTANT";

  const title = document.createElement("h1");
  title.textContent = q.title;

  const description = document.createElement("p");
  description.className = "description";
  description.textContent = q.description;

  card.appendChild(label);
  card.appendChild(title);
  card.appendChild(description);

  if (q.type === "choice") {

    const choices = document.createElement("div");
    choices.className = "choices";

    q.options.forEach(option => {

      const button = document.createElement("button");

      button.className = "choice";
      button.textContent = option;

      button.onclick = () => {
        saveAnswer(q, option);
      };

      choices.appendChild(button);

    });

    card.appendChild(choices);

  } else {

    const textarea = document.createElement("textarea");

    textarea.className = "text-input";
    textarea.placeholder = "ここに入力してください";

    if (answers[q.id]) {
      textarea.value = answers[q.id];
    }

    const next = document.createElement("button");

    next.className = "next-button";
    next.textContent = "次へ";

    next.onclick = () => {

      const value = textarea.value.trim();

      if (!value) {
        alert("回答を入力してください。");
        return;
      }

      saveAnswer(q, value);
    };

    card.appendChild(textarea);
    card.appendChild(next);
  }

  if (history.length > 0) {

    const back = document.createElement("button");

    back.className = "back-button";
    back.textContent = "← 前の質問に戻る";

    back.onclick = goBack;

    card.appendChild(back);
  }
}

function saveAnswer(question, value) {

  answers[question.id] = value;

  history.push({
    id: question.id,
    index: currentIndex
  });

  localStorage.setItem(
    "eaInterviewAnswers",
    JSON.stringify(answers)
  );

  currentIndex++;

  render();
}

function goBack() {

  if (history.length === 0) return;

  const previous = history.pop();

  delete answers[previous.id];

  currentIndex = previous.index;

  localStorage.setItem(
    "eaInterviewAnswers",
    JSON.stringify(answers)
  );

  render();
}

function finishInterview() {

  progressText.textContent =
    "EA設計進捗：100%";

  questionText.textContent =
    "ヒアリング完了";

  progressBar.style.width =
    "100%";

  localStorage.setItem(
    "eaInterviewAnswers",
    JSON.stringify(answers)
  );

  const visible = getVisibleQuestions();

  let summaryHTML = "";

  visible.forEach(q => {

    if (!answers[q.id]) return;

    summaryHTML += `
      <div class="summary-item">
        <div class="summary-question">
          ${escapeHTML(q.title)}
        </div>

        <div class="summary-answer">
          ${escapeHTML(answers[q.id])}
        </div>
      </div>
    `;
  });

  card.innerHTML = `
    <div class="label">
      AI EA ASSISTANT
    </div>

    <h1>
      EA設計ヒアリングが完了しました。
    </h1>

    <p class="description">
      回答内容からEAの基本仕様を整理しました。
      次の工程では、この仕様をAIが分析し、
      売買ルールの矛盾チェック、バックテスト用仕様、
      EAコード生成へつなげます。
    </p>

    <div class="notice">
      <strong>EA仕様書（ヒアリング結果）</strong><br>
      下の内容が、現在のEA設計データです。
    </div>

    <div class="summary">
      ${summaryHTML}
    </div>

    <button
      class="restart-button"
      onclick="restartInterview()">
      最初からやり直す
    </button>
  `;
}

function restartInterview() {

  const ok = confirm(
    "保存されている回答を削除して最初からやり直しますか？"
  );

  if (!ok) return;

  answers = {};
  history = [];
  currentIndex = 0;

  localStorage.removeItem(
    "eaInterviewAnswers"
  );

  render();
}

function escapeHTML(value) {

  return String(value)
    .replaceAll("&", "&amp;")
    .replaceAll("<", "&lt;")
    .replaceAll(">", "&gt;")
    .replaceAll('"', "&quot;")
    .replaceAll("'", "&#039;");
}

render();

</script>

</body>
</html>
